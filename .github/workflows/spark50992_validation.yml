name: SPARK-50992 validation

on:
  push:
    branches:
      - SPARK-50992-ci-validation-v7

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/spark50992/gz-* > /tmp/SPARK-50992-v7.patch.gz
          echo '59e88b2c85364b7edeafe752e0cb6a8f78e2e0f128648685f5ab5acc2dad48dc  /tmp/SPARK-50992-v7.patch.gz' | sha256sum -c -
          gzip -dc /tmp/SPARK-50992-v7.patch.gz > /tmp/SPARK-50992-v7.patch
          echo '81b40f75178190efc7048342f896f481eff7c22ee0e83a38c9e6f21d233ee795  /tmp/SPARK-50992-v7.patch' | sha256sum -c -
          git apply --check /tmp/SPARK-50992-v7.patch
          git apply /tmp/SPARK-50992-v7.patch
          git diff --check
          grep -F '<scala.version>2.13.18</scala.version>' pom.xml
          grep -n 'val append: String => Unit = concat.append' sql/core/src/main/scala/org/apache/spark/sql/execution/QueryExecution.scala
          test "$(grep -c 'val append: String => Unit = concat.append' sql/core/src/main/scala/org/apache/spark/sql/execution/QueryExecution.scala)" -eq 4

      - name: Compile catalyst and SQL tests
        shell: bash
        run: |
          set -o pipefail
          ./build/sbt -Phadoop-3 "catalyst/Test/compile" "sql/Test/compile" 2>&1 | tee /tmp/compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark50992-compile-log
          path: /tmp/compile.log

      - name: Print compile failure excerpt
        if: failure()
        shell: bash
        run: |
          echo '--- compiler errors ---'
          grep -nE '\[error\]|error:|\.scala:[0-9]+:' /tmp/compile.log | tail -n 200 || true
          echo '--- tail ---'
          tail -n 250 /tmp/compile.log || true

      - name: Run targeted regression suites
        run: |
          ./build/sbt -Phadoop-3 \
            "catalyst/testOnly org.apache.spark.sql.catalyst.util.StringUtilsSuite" \
            "catalyst/testOnly org.apache.spark.sql.catalyst.trees.TreeNodeSuite" \
            "sql/testOnly org.apache.spark.sql.execution.QueryExecutionSuite"

      - name: Run Scala lint
        run: ./dev/lint-scala
