name: SPARK-51264 targeted test

on:
  push:
    branches:
      - SPARK-51264-targeted-ci

jobs:
  jdbc-driver-connection-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Cache SBT and Maven
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: spark-51264-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties') }}
          restore-keys: |
            spark-51264-${{ runner.os }}-
            build-${{ runner.os }}-
      - name: Run JdbcDriverConnectionSuite
        env:
          SPARK_LOCAL_IP: localhost
        run: |
          ./build/sbt -Phadoop-3 -Phive "sql/testOnly org.apache.spark.sql.jdbc.JdbcDriverConnectionSuite"
