name: SPARK-51264 targeted iteration

on:
  push:
    branches:
      - SPARK-51264-targeted-ci

permissions:
  contents: write

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Prepare patch
        run: |
          cp .github/spark51264_iterate.py /tmp/spark51264_iterate.py
          git remote add upstream https://github.com/apache/spark.git || true
          git fetch upstream master
          git fetch origin SPARK-51264-retry
          git checkout -B SPARK-51264-retry upstream/master
          python3 /tmp/spark51264_iterate.py
          git diff --check
      - name: Run focused JDBC suite
        env:
          SPARK_LOCAL_IP: localhost
        run: |
          ./build/sbt -Phadoop-3 -Phive "sql/testOnly org.apache.spark.sql.jdbc.JDBCWriteSuite"
      - name: Update retry branch
        run: |
          git config user.name "__angel__"
          git config user.email "angel.alvarez.pascua@gmail.com"
          git add sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/jdbc/JdbcRelationProvider.scala
          git add sql/core/src/test/scala/org/apache/spark/sql/jdbc/JDBCWriteSuite.scala
          git commit -m "[SPARK-51264][SQL] Close driver connection before JDBC write"
          git push --force origin HEAD:SPARK-51264-retry
